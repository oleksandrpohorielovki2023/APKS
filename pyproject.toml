[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab1"
version = "0.1.0"
description = "Lab 1 (KI-402, variant 2): agent-driven build automation demo"
authors = [{ name = "Погорєлов Олександр Ігорович" }]
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
lab1 = "lab1.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
